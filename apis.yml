aid: bank-of-ireland-uk
url: https://raw.githubusercontent.com/api-evangelist/bank-of-ireland-uk/refs/heads/main/apis.yml
name: Bank of Ireland (UK)
kind: company
description: >-
  Bank of Ireland (UK) plc is the UK banking arm of Bank of Ireland Group plc,
  Ireland's oldest bank, founded in 1783 and headquartered in Dublin with a
  listing on Euronext Dublin and the London Stock Exchange. In the United
  Kingdom it is authorised by the Prudential Regulation Authority and regulated
  by the Financial Conduct Authority and the PRA, and as one of the nine
  CMA-mandated banks (the CMA9) it participates fully in the UK Open Banking
  programme under PSD2. Bank of Ireland (UK) and Bank of Ireland (ROI) are
  separate legal entities on the Open Banking Directory and TPPs must onboard to
  each separately. The bank publishes a public, unauthenticated Open Data API
  (ATMs, branches, personal and business current accounts, unsecured SME loans
  and commercial credit cards) conformant to the OBIE Open Data Standard,
  alongside the OBIE Read/Write API family - Account & Transaction Information
  (AIS), Payment Initiation (PIS) and Confirmation of Funds (CBPII) - secured
  with FAPI-grade OAuth2/OIDC, PSD2 strong customer authentication and mutual-TLS
  client authentication using OBIE/eIDAS certificates, onboarded through the Bank
  of Ireland Developer Hub with a sandbox for testing.
